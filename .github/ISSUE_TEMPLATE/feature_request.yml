name: Feature request
description: Suggest an improvement to the FocusMateAI workflow
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Feature area
      options:
        - Task planning
        - One-step guidance
        - Text simplification
        - Message drafting
        - History and export
        - Accessibility and personalization
        - AI provider configuration
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user need or friction this would address.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Explain the behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
